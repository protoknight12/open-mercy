name = "open-mercy-game-server"
main = "src/index.ts"
compatibility_date = "2026-04-28"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoomDO"]

# Supabase project used for token introspection (protoknight12/open-mercy's
# project). This is the publishable key: public by design, since it ships in
# every frontend bundle, and not a secret.
#
# Introspection fails closed: if this URL/key pair is wrong, verifySupabaseToken
# returns null and nobody can create or join a room.
#
# ALLOWED_ORIGINS: browser origins that may call the HTTP API (see src/cors.ts).
# One `*` per entry matches a run of letters, digits and hyphens.
#
# Voice chat (RealtimeKit) is off until REALTIMEKIT_ACCOUNT_ID plus the
# REALTIMEKIT_APP_ID and REALTIMEKIT_API_TOKEN secrets are set; without them
# /health reports voice:false and voice-join answers voice-unavailable.
[vars]
SUPABASE_URL = "https://virnfnbbakymsdxyrbuy.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_KkuEgQrv73KP1fpqUDXyaw_m5aUBmNU"
ALLOWED_ORIGINS = "https://open-mercy.vercel.app, https://open-mercy-protoknight12s-projects.vercel.app, https://open-mercy-*-protoknight12s-projects.vercel.app"
REALTIMEKIT_PRESET = "group_call_participant"
REALTIMEKIT_HOST_PRESET = "group_call_host"
